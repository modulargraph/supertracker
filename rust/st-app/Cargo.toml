[package]
name = "st-app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The SuperTracker executable: window, web view, menus, and a headless WebSocket bridge."
publish = false

[[bin]]
name = "supertracker"
path = "src/main.rs"

[dependencies]
st-host = { path = "../st-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Window, web view and menus.
tao = { version = "0.37", default-features = false, features = ["rwh_06", "x11"] }
wry = "0.57"
muda = "0.21"
# The headless bridge: a WebSocket on 127.0.0.1 (the HTTP side is a few lines of our own).
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
getrandom = "0.4"

# Native Open/Save dialogs. On Linux the window toolkit is GTK 3 (through tao), whose file chooser is used
# directly: rfd's GTK backend links a different gtk-sys than tao, wry and muda do.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.18", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
