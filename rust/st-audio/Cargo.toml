[package]
name = "st-audio"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The mixer graph around the engine, audio devices, offline rendering, recording."
publish = false

[dependencies]
tracker-engine = { path = "../tracker-engine" }
st-project = { path = "../st-project" }
# Status and device descriptions cross the bridge as JSON (st-host serializes them).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Audio devices (Apache-2.0). Linux: ALSA, needs the libasound2-dev package to build. macOS: CoreAudio.
cpal = "0.16"
