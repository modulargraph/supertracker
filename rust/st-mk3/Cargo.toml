[package]
name = "st-mk3"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Maschine MK3 controller driver: HID input, LEDs and displays."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HID without a C library on every platform (IOHIDManager, hidraw, Win32).
async-hid = { version = "0.5", default-features = false, features = ["async-io", "win32"] }
futures-lite = "2"
# USB bulk transfers for the displays, without libusb.
nusb = "0.2"
# Text on the displays, from the system's font files.
ab_glyph = { version = "0.2", features = ["variable-fonts"] }
