[workspace]
resolver = "2"
members = ["tracker-engine", "st-project", "st-host", "st-app"]
# A plain `cargo build` in this directory builds the engine only; name the other crates with -p.
default-members = ["tracker-engine"]
# The plug-in container has its own workspace (different dependencies and binaries).
exclude = ["plugin-host"]

[profile.release]
opt-level = 3
debug = 1
panic = "abort"
codegen-units = 1
lto = "thin"

[profile.dev]
panic = "abort"
