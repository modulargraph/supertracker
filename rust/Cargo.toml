[workspace]
resolver = "2"
members = ["tracker-engine", "st-project", "st-samples", "st-library", "st-midi", "st-mk3", "st-agent", "st-audio", "st-host", "st-app"]
# A plain `cargo build` in this directory builds the engine only; name the other crates with -p.
default-members = ["tracker-engine"]
# The plug-in container has its own workspace (different dependencies and binaries).
exclude = ["plugin-host"]

[profile.release]
opt-level = 3
debug = 1
panic = "abort"
codegen-units = 1
lto = "thin"

[profile.dev]
panic = "abort"
# Line tables only: full debug info makes every build folder several gigabytes.
debug = "line-tables-only"
