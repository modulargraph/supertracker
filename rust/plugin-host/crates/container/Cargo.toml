[package]
name = "stpc-container"
description = "SuperTracker plug-in container: the supertracker-plugin-container executable and its plug-in format backends."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "stpc_container"
path = "src/lib.rs"

[[bin]]
name = "supertracker-plugin-container"
path = "src/main.rs"

[dependencies]
libc.workspace = true
clap-sys.workspace = true
vst3.workspace = true
stpc-runtime.workspace = true

# macOS only: AppKit main loop, editor windows and the Audio Unit backend (src/macos, src/au).
# objc2 and its framework crates are MIT OR Apache-2.0 / Zlib. The "exception" feature
# compiles a small Objective-C shim in objc2's own helper crate (needs clang; when
# type-checking from Linux: CC_aarch64_apple_darwin=clang).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", features = ["exception"] }
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "objc2-core-foundation",
    "NSArray", "NSCoder", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry",
    "NSKeyValueObserving", "NSKeyedArchiver", "NSNotification", "NSObjCRuntime", "NSObject", "NSOperation",
    "NSProcessInfo", "NSPropertyList", "NSRange", "NSString", "NSURL", "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "libc", "objc2-core-foundation",
    "NSApplication", "NSEvent", "NSGraphics", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication",
    "NSGraphicsContext", "NSView", "NSViewController", "NSWindow", "NSWindowRestoration", "NSWorkspace",
] }
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = [
    "std", "bitflags", "block2", "objc2-core-audio-types", "objc2-core-foundation",
    "AUAudioUnit", "AUAudioUnitImplementation", "AUComponent", "AUParameters", "AudioComponent",
    "AudioUnitProperties", "AudioUnitUtilities",
] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = [
    "std", "objc2-audio-toolbox", "objc2-core-audio-types",
    "AVAudioChannelLayout", "AVAudioFormat", "AVAudioTypes", "AVAudioUnitComponent",
] }
objc2-core-audio-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "objc2-app-kit", "objc2-audio-toolbox",
    "AUGenericViewController", "AUViewController",
] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = [
    "std", "bitflags", "objc2", "CoreAudioBaseTypes",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "CFBase", "CFDate", "CFNumber", "CFRunLoop", "CFString",
] }

[dev-dependencies]
# Built (as a cdylib) before the tests, which load it through the CLAP backend.
stpc-clap-test-plugin = { path = "../clap-test-plugin" }
# Likewise for the VST3 backend (the tests package the library as a .vst3 bundle).
stpc-vst3-test-plugin = { path = "../vst3-test-plugin" }
stpc-client.workspace = true
stpc-transport.workspace = true
