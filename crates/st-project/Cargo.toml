[package]
name = "st-project"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"
description = "SuperTracker's project document: typed model, validation, project files and media, autosave, MIDI files."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 of media and project files (RustCrypto, MIT/Apache-2.0).
sha2 = "0.10"
