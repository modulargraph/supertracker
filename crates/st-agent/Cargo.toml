[package]
name = "st-agent"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"
description = "Local control socket and MCP server for AI clients."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "supertracker-mcp"
path = "src/bin/supertracker-mcp.rs"
