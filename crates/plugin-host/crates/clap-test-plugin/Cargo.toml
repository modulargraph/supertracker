[package]
name = "stpc-clap-test-plugin"
description = "A small CLAP plug-in (gain effect and sine instrument) used to test the container's CLAP backend end to end."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the plug-in itself (rename or symlink the library to *.clap to use it in a host).
# rlib: lets the container crate depend on it so that cargo builds it before the tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
clap-sys.workspace = true
