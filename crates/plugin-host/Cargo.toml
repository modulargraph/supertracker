# SuperTracker out-of-process plug-in hosting ("plug-in container").
# Its own workspace: Cargo.toml excludes this directory. See docs/PLUGIN_CONTAINER.md.
[workspace]
resolver = "2"
members = [
    "crates/transport",
    "crates/runtime",
    "crates/client",
    "crates/container",
    "crates/clap-test-plugin",
    "crates/vst3-test-plugin",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
libc = "0.2"
# CLAP ABI definitions (MIT OR Apache-2.0, no dependencies).
clap-sys = "0.5"
# VST3 COM interface bindings (MIT OR Apache-2.0; generated from the VST 3.8.0 SDK headers, which
# Steinberg publishes under the MIT licence; no SDK needed to build). One dependency:
# com-scrape-types (MIT OR Apache-2.0).
vst3 = "0.3"
stpc-transport = { path = "crates/transport" }
stpc-client = { path = "crates/client" }
stpc-runtime = { path = "crates/runtime" }

[profile.release]
opt-level = 3
debug = 1
